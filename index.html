<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusMart | UENR</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-icons">
                <span class="material-symbols-outlined splash-icon graduation">school</span>
                <span class="material-symbols-outlined splash-icon basket">shopping_basket</span>
            </div>
            <h1 class="splash-title">Campus<span>Mart</span></h1>
            <div class="loading-bar"><div class="loading-progress"></div></div>
        </div>
    </div>

    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <p>Syncing with CampusMart...</p>
    </div>

    <header class="main-header">
        <div class="header-top">
            <h1 class="brand-logo">Campus<span>Mart</span></h1>
            <div class="header-icons">
                <span class="material-symbols-outlined" onclick="showPage('account-page')">account_circle</span>
            </div>
        </div>
        <div class="search-container">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="search-input" placeholder="Search textbooks, gadgets, hostel gear...">
        </div>
    </header>

    <main id="app-content">
        <section id="home-page" class="page active">
            <div class="promo-banner">🔥 Hot Deals in UENR Campus</div>
            <div class="container">
                <h2 class="section-title">Fresh Listings</h2>
                <div id="listings-container" class="listings-grid"></div>
            </div>
        </section>

        <section id="category-page" class="page">
            <div class="container">
                <h2 class="section-title">Categories</h2>
                <div id="categories-grid" class="categories-grid">
                    </div>
            </div>
        </section>

        <section id="sell-page" class="page">
            <div class="container">
                <div class="form-card">
                    <h2 class="section-title">Post an Ad</h2>
                    <form id="sell-form">
                        <div class="input-group">
                            <label>Product Name</label>
                            <input type="text" id="item-title" placeholder="What are you selling?" required>
                        </div>
                        <div class="input-group">
                            <label>Category</label>
                            <select id="item-category" required></select>
                        </div>
                        <div class="input-group">
                            <label>Price (GHS)</label>
                            <input type="number" id="item-price" placeholder="0.00" required>
                        </div>
                        <div class="input-group">
                            <label>Image URL</label>
                            <input type="url" id="item-image" placeholder="Paste link from PostImages.org">
                        </div>
                        <div class="input-group">
                            <label>Description</label>
                            <textarea id="item-description" rows="3" placeholder="Tell students about your item..."></textarea>
                        </div>
                        <button type="submit" class="btn-primary">List Item Now</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="ads-page" class="page">
            <div class="container">
                <h2 class="section-title">My Ads</h2>
                <div id="my-ads-container"></div>
            </div>
        </section>

        <section id="account-page" class="page">
            <div class="account-card">
                <div class="avatar" id="user-avatar">?</div>
                <h3 id="user-name">Guest Student</h3>
                <p id="user-email">Login to post items</p>
                <div class="account-btns">
                    <button class="btn-outline" onclick="toggleDarkMode()">Toggle Dark Mode</button>
                    <button class="btn-danger" id="auth-btn" onclick="handleAuthAction()">Login</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('home-page')">
            <span class="material-symbols-outlined">home</span><p>Home</p>
        </div>
        <div class="nav-item" onclick="showPage('category-page')">
            <span class="material-symbols-outlined">grid_view</span><p>Shop</p>
        </div>
        <div class="nav-item sell-btn" onclick="checkAuthAndNavigate('sell-page')">
            <span class="material-symbols-outlined">add_circle</span><p>Sell</p>
        </div>
        <div class="nav-item" onclick="checkAuthAndNavigate('ads-page')">
            <span class="material-symbols-outlined">inventory_2</span><p>My Ads</p>
        </div>
        <div class="nav-item" onclick="showPage('account-page')">
            <span class="material-symbols-outlined">person</span><p>Account</p>
        </div>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
