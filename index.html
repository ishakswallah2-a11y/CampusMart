<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMart | UENR Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="top-nav">
            <div class="logo">Campus<span>Mart</span></div>
            <ul>
                <li><a href="javascript:void(0)" onclick="showPage('home-page')">Home</a></li>
                <li><a href="javascript:void(0)" onclick="showPage('sell-page')">Sell Item</a></li>
                <li><a href="javascript:void(0)" onclick="showPage('categories-page')">Categories</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home-page">
            <div class="hero">
                <h1>Campus Essentials, Simplified.</h1>
                <p>Buy and sell items within the UENR community instantly.</p>
            </div>
            <div class="content-padding">
                <h2>✨ New Listings on Campus</h2>
                <div class="product-grid" id="listings">
                    </div>
            </div>
        </section>

        <section id="sell-page" style="display: none;">
            <div class="content-padding">
                <h2>Turn Your Gear into Cash</h2>
                <form id="postItemForm" class="post-form">
                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" id="itemName" placeholder="e.g. iPhone 12" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="itemCategory">
                            <option value="Electronics">Electronics</option>
                            <option value="Hostel Essentials">Hostel Essentials</option>
                            <option value="Academic Gear">Academic Gear</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (GHS)</label>
                        <input type="number" id="itemPrice" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Product Details / Specs</label>
                        <textarea id="itemDescription" placeholder="e.g. 128GB, Battery 90%" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Your WhatsApp Number</label>
                        <input type="tel" id="sellerPhone" placeholder="054XXXXXXX" required>
                    </div>
                    <button type="submit" class="submit-btn">List Item Now</button>
                </form>
            </div>
        </section>

        <section id="categories-page" style="display: none;">
            <div class="content-padding">
                <h2>Browse by Category</h2>
                <div class="category-stack">
                    <button class="cat-btn" onclick="filterCategory('Electronics')">📱 Electronics</button>
                    <button class="cat-btn" onclick="filterCategory('Hostel Essentials')">🛌 Hostel Essentials</button>
                    <button class="cat-btn" onclick="filterCategory('Academic Gear')">📚 Academic Gear</button>
                </div>
            </div>
        </section>
    </main>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('detailsModal')">&times;</span>
            <div id="modalDetailsBody"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDWcC4KAKKsiKWKSbn2yJiDHpLXZm1Ywk",
        authDomain: "campusmart-5c975.firebaseapp.com",
        projectId: "campusmart-5c975",
        storageBucket: "campusmart-5c975.firebasestorage.app",
        messagingSenderId: "184864282111",
        appId: "1:184864282111:web:3a0e0c9a7bafa68fea03ca"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
    </script>
    <script src="script.js"></script>

    <nav class="bottom-nav">
        <a href="javascript:void(0)" onclick="showPage('home-page')" class="nav-item"><span>🏠</span><p>Home</p></a>
        <a href="javascript:void(0)" onclick="showPage('sell-page')" class="nav-item"><span>➕</span><p>Sell</p></a>
        <a href="javascript:void(0)" onclick="showPage('categories-page')" class="nav-item"><span>📁</span><p>Categories</p></a>
    </nav>
</body>
</html>
