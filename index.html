<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMart | UENR Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="top-nav">
            <div class="logo">Campus<span>Mart</span></div>
            <ul>
                <li><a href="javascript:void(0)" onclick="showPage('home-page')">Home</a></li>
                <li><a href="javascript:void(0)" onclick="showPage('sell-page')">Sell Item</a></li>
                <li><a href="javascript:void(0)" onclick="showPage('categories-page')">Categories</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 1. HOME PAGE -->
        <section id="home-page">
            <div class="hero">
                <h1>Campus Essentials, Simplified.</h1>
                <p>Buy and sell items within the UENR community instantly.</p>
            </div>
            <div class="content-padding">
                <h2>✨ New Listings on Campus</h2>
                <div class="product-grid" id="listings">
                    <!-- Listings load here -->
                </div>
            </div>
        </section>

        <!-- 2. SELL PAGE -->
        <section id="sell-page" style="display: none;">
            <div class="content-padding">
                <h2>Turn Your Gear into Cash</h2>
                <form id="postItemForm" class="post-form">
                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" id="itemName" placeholder="e.g. iPhone 11" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="itemCategory">
                            <option value="Electronics">Electronics</option>
                            <option value="Hostel Essentials">Hostel Essentials</option>
                            <option value="Academic Gear">Academic Gear</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (GHS)</label>
                        <input type="number" id="itemPrice" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Product Details / Specs</label>
                        <textarea id="itemDescription" placeholder="e.g. 128GB, Battery 85%" rows="4" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Your WhatsApp Number</label>
                        <input type="tel" id="sellerPhone" placeholder="054XXXXXXX" required>
                    </div>
                    <button type="submit" class="submit-btn">List Item Now</button>
                </form>
            </div>
        </section>

        <!-- 3. CATEGORIES PAGE (The New Update) -->
        <section id="categories-page" style="display: none;">
            <div class="content-padding">
                <h2>Browse by Category</h2>
                <div class="category-list" style="display: grid; gap: 10px; margin-top: 20px;">
                    <button class="submit-btn" style="background: #2e7d32;" onclick="alert('Filtering coming soon!')">📱 Electronics</button>
                    <button class="submit-btn" style="background: #2e7d32;" onclick="alert('Filtering coming soon!')">🛌 Hostel Essentials</button>
                    <button class="submit-btn" style="background: #2e7d32;" onclick="alert('Filtering coming soon!')">📚 Academic Gear</button>
                </div>
            </div>
        </section>

        <!-- 4. ACCOUNT PAGE -->
        <section id="account-page" style="display: none;">
            <div class="content-padding" style="text-align: center;">
                <h2>My Account</h2>
                <p>Welcome to your CampusMart profile.</p>
                <button class="submit-btn" style="background: #2e7d32; margin-top: 20px;">Contact Admin Support</button>
            </div>
        </section>
    </main>

    <!-- PRODUCT DETAILS MODAL -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('detailsModal')" style="float:right; cursor:pointer; font-size: 24px;">&times;</span>
            <div id="modalDetailsBody">
                <!-- Data injected here -->
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDWcC4KAKKsiKWKSbn2yJiDHpLXZm1Ywk",
        authDomain: "campusmart-5c975.firebaseapp.com",
        projectId: "campusmart-5c975",
        storageBucket: "campusmart-5c975.firebasestorage.app",
        messagingSenderId: "184864282111",
        appId: "1:184864282111:web:3a0e0c9a7bafa68fea03ca"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
    </script>
    <script src="script.js"></script>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="javascript:void(0)" onclick="showPage('home-page')" class="nav-item"><span>🏠</span><p>Home</p></a>
        <a href="javascript:void(0)" onclick="showPage('sell-page')" class="nav-item"><span>➕</span><p>Sell</p></a>
        <a href="javascript:void(0)" onclick="showPage('account-page')" class="nav-item"><span>👤</span><p>Account</p></a>
    </nav>
</body>
</html>
