<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMart | UENR Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="top-nav">
            <div class="logo">Campus<span>Mart</span></div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#sell-item">Sell Item</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Campus Essentials, Simplified.</h1>
        <p>Buy and sell items within the UENR community instantly.</p>
    </section>

    <main>
        <h2>✨ New Listings on Campus</h2>
        <div class="product-grid" id="listings">
            <!-- Listings load here -->
        </div>
    </main>

    <section id="sell-item" class="sell-section">
        <form id="postItemForm" class="post-form">
            <h2>List Your Item</h2>
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="itemName" placeholder="e.g. Laptop Stand" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="itemCategory">
                    <option value="Hostel Essentials">Hostel Essentials</option>
                    <option value="Academic Gear">Academic Gear</option>
                    <option value="Electronics">Electronics & Repair</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (GHS)</label>
                <input type="number" id="itemPrice" required>
            </div>
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" id="sellerPhone" placeholder="054XXXXXXX" required>
            </div>
            <button type="submit" class="submit-btn">List Item Now</button>
        </form>
    </section>

    <!-- Modals -->
    <div id="successModal" class="modal"><div class="modal-content"><h2>Done! 🚀</h2><p></p><button onclick="closeModal()" class="submit-btn">Awesome</button></div></div>
    <div id="welcomeModal" class="modal" style="display: flex;"><div class="modal-content"><h2>Welcome to CampusMart 🎓</h2><p>Official UENR hub.</p><button onclick="closeWelcome()" class="submit-btn">Get Started</button></div></div>
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="authTitle">Login</h2>
            <form id="authForm">
                <input type="email" id="authEmail" placeholder="Email" required style="width:100%; padding:10px; margin:10px 0;">
                <input type="password" id="authPassword" placeholder="Password" required style="width:100%; padding:10px; margin:10px 0;">
                <button type="submit" id="authSubmitBtn" class="submit-btn">Continue</button>
            </form>
            <p id="toggleAuth" style="margin-top:10px; cursor:pointer; color:#2e7d32;">Need an account? Sign Up</p>
            <button onclick="closeAuthModal()" style="background:none; border:none; color:gray; margin-top:10px;">Close</button>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDWcC4KAKKsiKWKSbn2yJiDHpLXZm1Ywk",
        authDomain: "campusmart-5c975.firebaseapp.com",
        projectId: "campusmart-5c975",
        storageBucket: "campusmart-5c975.firebasestorage.app",
        messagingSenderId: "184864282111",
        appId: "1:184864282111:web:3a0e0c9a7bafa68fea03ca"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const auth = firebase.auth();
    </script>
    <script src="script.js"></script>

    <nav class="bottom-nav">
        <a href="#" class="nav-item"><span>🏠</span><p>Home</p></a>
        <a href="#sell-item" class="nav-item"><span>➕</span><p>Sell</p></a>
        <a href="#" id="accountBtn" class="nav-item"><span>👤</span><p>Account</p></a>
    </nav>
</body>
</html>
